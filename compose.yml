
services:
  app:
    build: .
    container_name: almamlaka-chatbot
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
    volumes:
      - model_cache:/root/.cache/huggingface
    depends_on:
      - qdrant
      - phoenix
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: almamlaka-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: almamlaka-phoenix
    ports:
      - "6006:6006"
      - "4317:4317"
      - "4318:4318"
    environment:
      PHOENIX_PORT: 6006
    volumes:
      - phoenix_data:/root/.phoenix
    restart: unless-stopped

volumes:
  qdrant_data:
  model_cache:
  phoenix_data:
